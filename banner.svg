<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1440"/>
      <stop offset="35%" stop-color="#2f1a63"/>
      <stop offset="70%" stop-color="#4c2896"/>
      <stop offset="100%" stop-color="#6d3fc4"/>
    </linearGradient>
    <radialGradient id="blueSpot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleSpot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b9eff"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <circle cx="90" cy="30" r="220" fill="url(#blueSpot)"/>
  <circle cx="1120" cy="260" r="260" fill="url(#purpleSpot)"/>

  <!-- connector node icon, top-left -->
  <g>
    <line x1="70" y1="76" x2="100" y2="76" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="66" cy="76" r="4" fill="#38bdf8"/>
    <rect x="100" y="52" width="72" height="48" rx="10" fill="url(#iconGrad)"/>
    <text x="136" y="84" font-family="'Aptos','Segoe UI',Arial,sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">&lt;/&gt;</text>
    <line x1="172" y1="60" x2="200" y2="60" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="204" cy="60" r="4" fill="#38bdf8"/>
  </g>

  <!-- headline -->
  <text x="600" y="160" font-family="'Aptos','Calibri','Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="50" fill="url(#text)" text-anchor="middle" letter-spacing="0.5">
    Taking Ideas to Real-Time AI Agents
  </text>
  <text x="600" y="202" font-family="'Aptos','Calibri','Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="500" font-size="17" fill="#e9d5ff" fill-opacity="0.85" text-anchor="middle" letter-spacing="2.5">
    FULL STACK &nbsp;·&nbsp; AI &amp; MACHINE LEARNING &nbsp;·&nbsp; SYSTEMS THAT REASON
  </text>
</svg>
